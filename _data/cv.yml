experience:
  - role: "Senior Researcher"
    org: "Dolby Laboratories, Advanced Technology Group"
    place: "Bengaluru, India"
    dates: "May 2026 to present"
    text: "Working on multimodal and long-form video understanding."
  - role: "Senior Project Scientist"
    org: "IIT Jodhpur"
    place: "Jodhpur, India"
    dates: "Jan 2026 to Apr 2026"
    text: "Worked on video-to-video retrieval: given a short query clip, finding the matching segments across a collection of untrimmed videos, without going through text."
  - role: "Research collaboration with Microsoft Bing"
    org: "IIT Jodhpur, supported by the Microsoft Academic Partnership Grant"
    place: "Jodhpur, India"
    dates: "Jul 2024 to Jun 2025"
    text: "Worked with colleagues at Microsoft Bing, Hyderabad, on searching long, untrimmed videos for actions and moments using text and video queries. Together we built MATR, a transformer that retrieves a moment using a video clip as the query, so the moment does not have to be described in words. The work appeared at <a href=\"/#pub-iccv25\">ICCV 2025</a>, ICVGIP 2024, and in <a href=\"/#pub-matr-journal\">CVIU</a>, along with the SportsMoments and ChapVidMR benchmarks."
  - role: "Research collaboration with Accenture Labs"
    org: "IIT Jodhpur, supported by an Accenture Gift Grant"
    place: "Jodhpur, India"
    dates: "Jul 2023 to Jun 2024"
    text: "Worked with colleagues at Accenture Labs, Bangalore, on localizing unseen objects and their interactions in videos from a handful of examples. This included QDETRv, a query-guided DETR for one-shot object localization, and a few-shot approach to grounding subject, predicate, and object relations across frames. The work appeared at <a href=\"/#pub-cvpr23\">CVPR 2023</a> and <a href=\"/#pub-aaai24\">AAAI 2024</a>."
  - role: "PhD Researcher and Teaching Assistant"
    org: "IIT Jodhpur, VL2G Lab"
    place: "Jodhpur, India"
    dates: "Aug 2020 to Dec 2025"
    text: "Research in the <a href=\"https://vl2g.github.io/\">Vision, Language, and Learning Group</a> with Dr. Anand Mishra, alongside teaching assistance for seven courses."

