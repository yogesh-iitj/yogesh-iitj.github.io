<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include google_analytics.html %}
  <title>{% if page.title and page.title != "" %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <link rel="canonical" href="https://yogesh-iitj.github.io{{ page.url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="https://yogesh-iitj.github.io{{ page.url }}">
  <meta property="og:image" content="https://yogesh-iitj.github.io/images/{{ site.author.avatar }}">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} Feed" href="/feed.xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/assets/fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/modern.css?v={{ site.time | date: '%Y%m%d%H%M' }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include modern/nav.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include modern/footer.html %}
  <script src="/assets/js/modern.js?v={{ site.time | date: '%Y%m%d%H%M' }}"></script>
</body>
</html>
